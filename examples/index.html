<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>pyrepl-web test</title>
    <script>
        // Register custom themes
        window.pyreplThemes = {
            // Full custom theme with pygmentsStyle
            'tokyo-night': {
                background: '#1a1b26',
                foreground: '#a9b1d6',
                promptColor: '#bb9af7',
                pygmentsStyle: {
                    'Token': '#a9b1d6',
                    'Keyword': '#bb9af7',
                    'String': '#9ece6a',
                    'Number': '#ff9e64',
                    'Comment': '#565f89',
                    'Name.Function': '#7aa2f7',
                    'Name.Builtin': '#7dcfff',
                }
            },
            // Minimal dark theme (inherits mocha colors)
            'minimal-dark': {
                background: '#0d1117',
                foreground: '#c9d1d9',
            },
            // Minimal light theme (inherits latte colors)
            'minimal-light': {
                background: '#ffffff',
                foreground: '#24292f',
                headerBackground: 'pink',
                headerForeground: '#57606a',
            },
            // Custom prompt color (hex)
            'green-prompt': {
                background: '#1e1e2e',
                foreground: '#cdd6f4',
                promptColor: '#50fa7b',
            },
            // Custom prompt color (named)
            'cyan-prompt': {
                background: '#282a36',
                foreground: '#f8f8f2',
                promptColor: 'cyan',
            },
        };
    </script>
    <script src="/dist/pyrepl.js"></script>

</head>

<body>
    <h1>pyrepl-web</h1>
    <p>Python in the browser. <a href="/benchmark">View the performance benchmark</a>.</p>
    <py-repl repl-title="Python REPL"></py-repl>
</body>

</html>
